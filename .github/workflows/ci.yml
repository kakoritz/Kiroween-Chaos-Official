name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]

# Policy (owner decision, see docs/KIRO-LOG.md): CI never runs tests.
# Unit tests run locally and are the merge gate. Do not add test steps here.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run validate:events
      - run: npm run build
