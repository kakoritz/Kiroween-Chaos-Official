# Example: the Chaos Haunt sweep Action on a pull request. Copy to .github/workflows/ in your repo.
# Opt-in: this repo does not run it as a required check (see docs/DECISIONS.md).
# It runs chaos against your app, not your unit tests. Exit codes: 0 targets passed, 1 a target failed, 2 usage or config error.
name: haunt-sweep

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  haunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/haunt-sweep # or kakoritz/Kiroween-Chaos/.github/actions/haunt-sweep@<pinned sha>
        with:
          config: haunt.yaml
          tiers: phoenix
          fail-on: targets
          comment: 'true'
