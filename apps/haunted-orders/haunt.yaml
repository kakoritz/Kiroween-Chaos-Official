name: haunted-orders
start: node dist/bots/phoenix.js
adapter: sdk
inputs: ./orders/
truth: http://127.0.0.1:7071
targets:
  recoverMs: 20000
  repeats: 0
  concurrency: 8
stages:
  - id: account
    label: Account or login
    role: effect
    effects:
      - { kind: account, key: account, idempotent: required }
    duration: [400, 800]
  - id: create
    label: Create order
    role: input
    duration: [300, 700]
  - id: submit
    label: Submit order
    role: effect
    effects:
      - { kind: order, key: order, idempotent: required }
    duration: [200, 400]
  - id: payment
    label: Payment
    role: effect
    effects:
      - { kind: charge, key: charge, idempotent: required }
    duration: [700, 1300]
  - id: confirmation
    label: Confirmation
    role: effect
    effects:
      - { kind: email, key: email, idempotent: preferred }
    duration: [300, 600]
  - id: receive
    label: Store receives
    role: effect
    effects:
      - { kind: store, key: "store:1", idempotent: required }
    duration: [200, 400]
  - id: process
    label: Process order
    role: effect
    effects:
      - { kind: store, key: "store:2", idempotent: required }
    duration: [300, 600]
  - id: updates
    label: Order updates
    role: effect
    effects:
      - { kind: notify, key: "notify:1", idempotent: preferred }
      - { kind: notify, key: "notify:2", idempotent: preferred }
    duration: [300, 600]
  - id: ship
    label: Ship and pack
    role: effect
    effects:
      - { kind: dispatch, key: dispatch, idempotent: required }
    duration: [500, 1000]
  - id: transit
    label: Delivery updates
    role: poll
    duration: [1500, 3000]
  - id: handoff
    label: Handoff
    role: final
    duration: [300, 600]
