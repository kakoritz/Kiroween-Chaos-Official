# Haunted Playback: a viewer watches a title (the Streaming pack's story, packs/streaming/pack.yaml), built only from library blocks.
# No engine code: this file is the whole app. Run it with: npm run live -- --app apps/haunted-playback
name: playback
label: Haunted Playback
idPrefix: vid
start: node dist/generic-bots/phoenix.js
truth: http://127.0.0.1:7071
targets:
  recoverMs: 20000
  repeats: 0
  concurrency: 8
stages:
  - { use: create_account, id: login, label: Account or login }
  - { use: transform, id: profile, label: Profile pick }
  - { use: browse, label: Browse }
  - { use: decide, id: title_select, label: Title select }
  - { use: charge, id: entitlement, label: Entitlement check }
  - { use: store_record, id: license, label: License or DRM }
  - { use: dispatch_job, id: start_stream, label: Start stream }
  - { use: buffer_wait, id: buffering, label: Buffering and bitrate }
  - { use: render, label: Render }
  - { use: notify, id: ads, label: Ads and pause or resume }
  - { use: store_record, id: finish, label: Finish and history }
# The names of the Streaming pack (packs/streaming/pack.yaml), shown in the arena on the engine fault underneath.
creatures:
  - { name: Buffer Wraith, stage: buffering, faults: [slow_link, internet_outage, endpoint_down] }
  - { name: CDN Kraken, stage: start_stream, faults: [timeout, comm_timeout, endpoint_down, http_500] }
  - { name: Doppelganger, stage: start_stream, faults: [crash, out_of_memory, power_outage] }
  - { name: DRM Gatekeeper, stage: license, faults: [http_404, http_429, http_500, timeout, comm_timeout] }
  - { name: Region Warden, stage: entitlement, faults: [http_404, http_429, http_500] }
  - { name: Render Gremlin, stage: render, faults: [crash, out_of_memory, power_outage, disk_full] }
  - { name: Poltergeist, stage: finish, faults: [crash, out_of_memory, power_outage] }
  - { name: Cloud Banshee, faults: [internet_outage, endpoint_down] }
  - { name: Reaper, faults: [crash, out_of_memory, power_outage] }
